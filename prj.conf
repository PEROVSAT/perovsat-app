CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_SENSOR=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_LOG_BUFFER_SIZE=8192

# Main thread does things like LittleFS, so even if it ends once booted, it still needs some allocation
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_STACK_INFO=y

#CONFIG_SHELL=y # Turn these on when you want to use something like i2c scan
#CONFIG_I2C_SHELL=y
